name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Node.js API ──────────────────────────────────────────────────────
  lint-api:
    name: Lint and type-check Node.js API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json
      - run: cd services/api && npm ci
      - run: cd services/api && npm run lint
      - run: cd services/api && npm run type-check

  test-api:
    name: Test Node.js API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docsense_test
          POSTGRES_USER: docsense
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd services/api && npm ci
      - run: cd services/api && npm test
        env:
          DATABASE_URL: postgresql://docsense:testpassword@localhost:5432/docsense_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key_for_ci_use_only
          JWT_REFRESH_SECRET: test_refresh_secret_key_for_ci
          NODE_ENV: test

  # ── Python services ──────────────────────────────────────────────────
  test-rag:
    name: Test RAG Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/rag/requirements.txt
      - run: cd services/rag && pip install -r requirements.txt
      - run: cd services/rag && pytest tests/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  test-agent:
    name: Test Agent Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/agent/requirements.txt
      - run: cd services/agent && pip install -r requirements.txt
      - run: cd services/agent && pytest tests/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # ── Frontend ─────────────────────────────────────────────────────────
  test-web:
    name: Type-check and test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - run: cd apps/web && npm run type-check
      - run: cd apps/web && npm test

  # ── Docker build + smoke test ─────────────────────────────────────────
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint-api, test-api, test-rag, test-agent, test-web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        env:
          POSTGRES_PASSWORD: ci_test_password
        run: docker compose build

      - name: Smoke test — boot databases
        env:
          POSTGRES_PASSWORD: ci_test_password
        run: |
          docker compose up -d postgres redis qdrant
          echo "Waiting 30s for databases..."
          sleep 30
          docker compose up -d rag-service
          sleep 30
          docker compose ps
          docker compose down -v

  # ── Deploy to production ──────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
            docker login ${{ vars.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Build and push images
        env:
          REGISTRY: ${{ vars.REGISTRY_URL }}
          SHA: ${{ github.sha }}
        run: |
          docker build -t "${REGISTRY}/docsense-api:${SHA}"   services/api
          docker build -t "${REGISTRY}/docsense-rag:${SHA}"   services/rag
          docker build -t "${REGISTRY}/docsense-agent:${SHA}" services/agent
          docker build -t "${REGISTRY}/docsense-web:${SHA}"   apps/web

          docker push "${REGISTRY}/docsense-api:${SHA}"
          docker push "${REGISTRY}/docsense-rag:${SHA}"
          docker push "${REGISTRY}/docsense-agent:${SHA}"
          docker push "${REGISTRY}/docsense-web:${SHA}"

          # Update latest tags
          for svc in api rag agent web; do
            docker tag "${REGISTRY}/docsense-${svc}:${SHA}" "${REGISTRY}/docsense-${svc}:latest"
            docker push "${REGISTRY}/docsense-${svc}:latest"
          done

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          echo "${KUBECONFIG_DATA}" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl set image deployment/api  api="${REGISTRY}/docsense-api:${SHA}"   -n docsense
          kubectl set image deployment/web  web="${REGISTRY}/docsense-web:${SHA}"   -n docsense
          kubectl set image deployment/rag-service   rag-service="${REGISTRY}/docsense-rag:${SHA}"   -n docsense
          kubectl set image deployment/agent-service agent-service="${REGISTRY}/docsense-agent:${SHA}" -n docsense
          kubectl rollout status deployment/api   -n docsense --timeout=120s
          kubectl rollout status deployment/web   -n docsense --timeout=60s
