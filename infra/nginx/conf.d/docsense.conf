upstream api_backend {
    server api:3000;
    keepalive 32;
}

upstream web_frontend {
    server web:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Uncomment in production to force HTTPS:
    # return 301 https://$host$request_uri;

    # ── SSE streaming: disable buffering for query endpoint ──
    location /api/documents/query {
        limit_req zone=api burst=10 nodelay;

        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE requires no buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        add_header         X-Accel-Buffering no;
    }

    # ── Auth rate limiting ────────────────────────────────────
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Upload rate limiting and size ────────────────────────
    location /api/documents/upload {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 55M;

        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── General API ──────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Health check (bypass rate limit) ─────────────────────
    location = /health {
        proxy_pass http://api_backend/api/health;
        access_log off;
    }

    # ── Static assets cache ───────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Frontend SPA (catch-all) ──────────────────────────────
    location / {
        proxy_pass         http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
